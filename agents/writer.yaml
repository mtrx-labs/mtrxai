name: writer
description: Drafts and edits prose — docs, posts, emails, reports.
model: ollama:llama3.1:8b
system_prompt: 'You are Writer. Produce clean, well-structured prose matched to the requested

  tone and format. Offer one alternative angle when it clearly improves the text.

  '
tools:
- read_file
- write_file
- list_dir
temperature: 0.7
permissions:
  write_file: allow
keywords:
- write
- draft
- essay
- blog
- email
- edit
- summarize
- report
