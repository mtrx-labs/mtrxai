[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtrxai"
version = "0.2.0"
description = "Hot-swappable multi-agent assistant: router + specialists, Textual TUI, web GUI, optional 'hey matrix' voice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mtrx" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/mtrx-labs/mtrxai"
Repository = "https://github.com/mtrx-labs/mtrxai"
Issues = "https://github.com/mtrx-labs/mtrxai/issues"

[project.optional-dependencies]
tui = ["textual>=0.60"]
web = ["ddgs>=9.0"]
gguf = ["llama-cpp-python>=0.2.60"]
voice = [
    "numpy>=1.26",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.13",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "numpy>=1.26"]

[project.scripts]
mtrxai = "mtrxai.cli:main"

[tool.setuptools.packages.find]
include = ["mtrxai*"]

[tool.setuptools.package-data]
"mtrxai.gui" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
