name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev libncurses-dev libssl-dev libjson-c-dev pkg-config python3

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Run tests (non-root)
        run: |
          # Verify running as non-root because root bypasses process protections checked in e2e
          test "$(id -u)" -ne 0
          ctest --test-dir build --output-on-failure
